name: integration-tests

# Behavioral tests for the client portal: seed a throwaway Postgres, run the
# real read-model functions, assert actual numbers. This is the layer the
# static guards can't provide — it gates money/scope/redaction correctness.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-portal-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # A throwaway DB — the harness hard-refuses anything that looks like prod.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pptest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply schema to the test database
        run: npm run test:client-portal-integration:setup
      - name: Run client-portal integration suite
        run: npm run test:client-portal-integration
      - name: Run CP-043 returns recovery integration suite
        run: npm run test:client-portal-returns-cp043:integration
      - name: Run CP-045 return-inspection authority integration suite
        run: npm run test:client-portal-returns-cp045:integration
      - name: Run CP-057 duplicate-postage integration suite
        run: npm run test:client-portal-returns-cp057:integration
      - name: Run CP-057/058 public-route and storage-compensation suite
        run: npm run test:client-portal-returns-cp058:integration
      - name: Run CP-060 per-shipment shipping classification suite
        run: npm run test:client-portal-analysis-cp060:integration
      # CP-059. The contract guard proves the boundary in isolation; this proves what only a
      # real database can — that presentation enrichment joins correctly, that an enrichment
      # MISS cannot erase a canonical Return row, and that sort/pagination never regroup.
      - name: Run CP-059 canonical billing event-row integration suite
        run: npm run test:client-portal-billing-cp059:integration
      # Cross-repo classification ownership. Runs the local half always; the
      # upstream half only when PREPSHIP_CONTRACT_TOKEN is configured (prepship-v4
      # is private, so the default GITHUB_TOKEN cannot read it). Without the
      # secret this reports NOT ARMED rather than silently passing.
      # CP-059. The RETURN line-type vocabulary is owned upstream; a spelling present there
      # and missing here drops return money out of the return bucket while leaving it inside
      # grand_total. Same arming rule as the expedited gate above: without the secret this
      # reports NOT ARMED rather than silently passing.
      - name: Check PrepShip return line-type vocabulary parity
        env:
          PREPSHIP_CONTRACT_TOKEN: ${{ secrets.PREPSHIP_CONTRACT_TOKEN }}
        run: |
          if [ -n "$PREPSHIP_CONTRACT_TOKEN" ]; then
            node scripts/prepship-return-vocabulary-parity.mjs
          else
            node scripts/prepship-return-vocabulary-parity.mjs --allow-unarmed
          fi
      - name: Check PrepShip expedited-service classification parity
        env:
          PREPSHIP_CONTRACT_TOKEN: ${{ secrets.PREPSHIP_CONTRACT_TOKEN }}
        run: |
          if [ -n "$PREPSHIP_CONTRACT_TOKEN" ]; then
            node scripts/prepship-expedited-parity.mjs
          else
            node scripts/prepship-expedited-parity.mjs --allow-unarmed
          fi
      - name: Run CP-048 access security integration suite
        run: npm run test:client-portal-access-security:integration
      - name: Run shopify connect integration suite
        run: npm run test:shopify-connect-integration
      # Last on purpose: its final fail-soft scenario DROPS the replacement
      # tables, so nothing that needs them may run after it in this job.
      - name: Run CP-061 replacements read-model and badge suite
        run: npm run test:client-portal-replacements-cp061:integration
