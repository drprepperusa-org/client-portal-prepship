name: Keep Render API warm

on:
  # Automatic GitHub schedules are disabled. Render API/worker uptime is owned
  # by Render now; keep this only as a manual emergency health ping.
  workflow_dispatch:

jobs:
  keepalive:
    name: GET Render health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          # The client-portal API (matches render-watchdog.yml's PORTAL_API_URL).
          # Schedule stays disabled — Render always-on owns uptime — this is only
          # the manual emergency health ping, so it must hit the RIGHT service.
          API_URL: ${{ vars.PORTAL_API_URL || 'https://client-portal-prepship.onrender.com' }}
        run: |
          url="${API_URL%/}/health"
          echo "GET $url"

          set +e
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            "$url")
          curl_exit=$?
          set -e

          response="${response:-000}"
          echo "HTTP $response"
          if [ -f /tmp/body ]; then
            cat /tmp/body
          fi
          echo ""

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Render health ping failed with exit code $curl_exit"
            exit "$curl_exit"
          fi

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "::error::Render health returned $response"
            exit 1
          fi
